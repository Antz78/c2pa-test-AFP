# Régénère automatiquement photos.json à chaque push de photos dans PHOTOS/,
# puis publie la galerie sur GitHub Pages. Aucune action manuelle :
# glissez vos photos dans PHOTOS/, committez, poussez — la galerie se met à jour.
name: Galerie C2PA

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Générer photos.json
        run: python scripts/gen_photos_json.py
      - name: Configurer Pages
        uses: actions/configure-pages@v5
      - name: Uploader l'artifact
        uses: actions/upload-pages-artifact@v3
        with: { path: . }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
